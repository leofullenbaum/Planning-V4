<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600&display=swap">
<!--
  Planning stations V4 : page unique de l'application.
  Ce fichier ne contient que la structure de la page. Le style est dans css/, le code dans js/.
  Voir docs/architecture.md pour le rôle de chaque fichier.
-->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/carnet.css">
<link rel="stylesheet" href="css/vue-planning.css">
<link rel="stylesheet" href="css/vue-semaine.css">
<link rel="stylesheet" href="css/fiches.css">
<link rel="stylesheet" href="css/atelier.css">

<!-- ===== Planning : barre d'outils, alertes, carnet et vue choisie ===== -->
<div class="app" id="app">
  <div class="bar">
    <div class="brand"><h1>Planning stations V4</h1><span class="wk" id="wkno"></span></div>
    <div class="seg" role="group" aria-label="Échelle">
      <button id="vsem" aria-pressed="false">Semaine</button><button id="v4s" aria-pressed="true">4 semaines</button><button id="v3m" aria-pressed="false">3 mois</button>
    </div>
    <div class="weeknav">
      <button class="btn icon" id="prev" aria-label="Période précédente">◀</button>
      <span class="lbl" id="periode"></span>
      <button class="btn icon" id="next" aria-label="Période suivante">▶</button>
      <button class="btn" id="todayBtn">Aujourd'hui</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="newS">+ Commande</button>
      <button class="btn" id="setBtn">Réglages</button>
      <button class="btn" id="atelierBtn">Écran atelier</button>
    </div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="chips" id="chips"></div>
  <div class="board">
    <aside class="carnet">
      <div class="zone-title">Carnet de commandes <small id="ccount"></small></div>
      <div id="carnet" data-carnet="1"></div>
      <button class="btn" id="autoBtn">Placer automatiquement</button>
      <div class="hint">Glissez une commande sur un emplacement. Le placement automatique remplit le premier emplacement libre, par date de livraison.</div>
    </aside>
    <div style="min-width:0; display:flex; flex-direction:column; gap:8px;">
      <div class="gwrap" id="gwrap"><div class="gt" id="gt"></div></div>
      <div class="gfoot" id="oldleg">
        <span><i class="sw" style="background:color-mix(in srgb, var(--accent) 30%, var(--surface))"></i>En cours</span>
        <span><i class="sw" style="background:color-mix(in srgb, var(--st-run) 25%, var(--surface))"></i>À venir</span>
        <span><i class="sw" style="background:color-mix(in srgb, var(--st-done) 25%, var(--surface))"></i>Sortie</span>
        <span>▼ Date de livraison (rouge si la station sort après)</span>
        <span id="regle"></span>
      </div>
    </div>
  </div>
</div>

<!-- ===== Écran atelier (TV) : affiché à la place du planning avec l'adresse /#atelier ===== -->
<div class="atelier" id="atelier" hidden>
  <div class="a-head">
    <div class="a-clock" id="aclock">--:--</div>
    <div class="a-date" id="adate"></div>
    <div class="a-tools">
      <button class="btn" id="fsBtn">Plein écran</button>
      <button class="btn" id="backBtn">Retour au planning</button>
    </div>
  </div>
  <div class="a-plan" id="aplan"></div>
  <div class="a-foot"><span id="alive">Mise à jour en direct</span><span>Planning stations V4</span></div>
</div>

<!-- ===== Panneau latéral (fiches) et message en bas d'écran ===== -->
<div class="overlay" id="ovl" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<!--
  Code de l'application. L'ordre de chargement compte :
  les outils d'abord, les vues ensuite, demarrage.js en dernier.
-->
<script src="js/connexion-serveur.js"></script>
<script src="js/outils.js"></script>
<script src="js/calendrier.js"></script>
<script src="js/exemple.js"></script>
<script src="js/enregistrement.js"></script>
<script src="js/placement-auto.js"></script>
<script src="js/vue-planning.js"></script>
<script src="js/gamme.js"></script>
<script src="js/charge-alertes.js"></script>
<script src="js/vue-atelier.js"></script>
<script src="js/glisser-deposer.js"></script>
<script src="js/fiches.js"></script>
<script src="js/reglages.js"></script>
<script src="js/vue-semaine.js"></script>
<script src="js/demarrage.js"></script>
