<script>
/* Connexion au serveur local : remplace la base claude.ai par /api */
(function () {
  let state = null; const subs = [];
  const docSnap = (id, d) => ({ id, exists: d !== undefined, data: () => d });
  const emit = () => subs.forEach(f => f());
  function connect() {
    const es = new EventSource("/api/events");
    es.onmessage = (e) => { state = JSON.parse(e.data); emit(); };
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  }
  const send = async (method, col, id, data) => {
    const r = await fetch(`/api/${col}/${encodeURIComponent(id)}`, { method, headers: { "Content-Type": "application/json" }, body: data === undefined ? undefined : JSON.stringify(data) });
    if (!r.ok) throw new Error("http " + r.status);
  };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const doc = (col, id) => ({
    id,
    set: (d) => send("PUT", col, id, d), update: (d) => send("PATCH", col, id, d), delete: () => send("DELETE", col, id),
    onSnapshot(next) { const f = () => state && next(docSnap(id, state[col][id])); subs.push(f); f(); return () => {}; },
  });
  const db = {
    collection: (col) => ({
      doc: (id) => doc(col, id || newId()),
      onSnapshot(next) {
        const f = () => { if (!state) return; const docs = Object.entries(state[col]).map(([id, d]) => docSnap(id, d)); next({ docs, size: docs.length, metadata: { fromCache: false } }); };
        subs.push(f); f(); return () => {};
      },
    }),
    doc: (p) => { const [col, id] = p.split("/"); return doc(col, id); },
  };
  connect();
  window.claude = { use: async (name) => (name === "db" ? db : null) };
})();
</script>

/* Layout: barre d'outils, colonne « À planifier » à gauche, grille postes × jours à droite ; écran atelier en colonnes par poste */
:root {

  --accent: #1db89c; --accent-soft: #143a33; --accent-ink: #04140f;
  --st-todo: #8f9794; --st-run: #7fb3aa; --st-done: #6b7471; --st-block: #ec6464;
  --drop: #143a33; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25); color-scheme: dark } }

  --accent: #1db89c; --accent-soft: #143a33; --accent-ink: #04140f;
  --st-todo: #8f9794; --st-run: #7fb3aa; --st-done: #6b7471; --st-block: #ec6464;
  --drop: #143a33; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; min-height: 100%; padding-inline: 16px; padding-block: 12px 24px; gap: 12px; }

.brand .wk { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }

.grid-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

[data-drop].hover { background: var(--drop); outline: 2px dashed var(--st-run); outline-offset: -2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--st-todo); border-radius: 6px; padding: 6px 8px; box-shadow: var(--shadow); cursor: grab; touch-action: none; user-select: none; display: flex; flex-direction: column; gap: 2px; }
.backlog .card { background: var(--surface); }
.card.s-en_cours { border-left-color: var(--st-run); }
.card.s-termine { border-left-color: var(--st-done); opacity: .72; }

.c-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.c-num { font-family: var(--f-mono); font-size: 12px; }
.c-h { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-art { font-weight: 600; line-height: 1.25; }

.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 1px 5px; }
.st { display: inline-flex; align-items: center; gap: 4px; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-todo); }
.st.s-en_cours::before { background: var(--st-run); }
.st.s-termine::before { background: var(--st-done); }
.st.s-bloque::before { background: var(--st-block); }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: rotate(1.5deg); box-shadow: 0 10px 28px rgba(0,0,0,.25); cursor: grabbing; }
.marker { height: 3px; border-radius: 2px; background: var(--st-run); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Panneaux */
.overlay { position: fixed; inset: 0; background: rgba(10,15,20,.45); z-index: 40; display: flex; justify-content: flex-end; }
.sheet { background: var(--surface); width: min(440px, 100%); height: 100%; overflow-y: auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; box-shadow: -8px 0 24px rgba(0,0,0,.2); }
.sheet h2 { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
label.f input, label.f select, label.f textarea, .prow input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; color: var(--ink); font-size: 14px; min-width: 0; }
label.chk { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.sheet .actions { margin-top: 4px; }
.prow { display: grid; grid-template-columns: minmax(0,1fr) 84px auto; gap: 8px; align-items: center; }
.prow .u { font-size: 11px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; z-index: 60; font-size: 13px; max-width: calc(100% - 32px); }

/* Écran atelier : look unique, contrasté, pensé pour une TV */
.atelier { --a-bg: #ffffff; --a-panel: #f3f6f5; --a-panel-2: #e6eeeb; --a-ink: #3f3e3f; --a-muted: #6c6e71; --a-line: #dbe3e0; --a-accent: #009881;
  --a-todo: #8a8d90; --a-run: #009881; --a-done: #9aa59f; --a-block: #d03b3b;
  position: fixed; inset: 0; z-index: 30; background: var(--a-bg); color: var(--a-ink); overflow: auto; color-scheme: light;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.a-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; border-bottom: 3px solid var(--a-accent); padding-bottom: 10px; }
.a-clock { font-family: var(--f-display); font-weight: 700; font-size: clamp(44px, 6vw, 84px); line-height: .9; font-variant-numeric: tabular-nums; }
.a-date { font-family: var(--f-display); font-weight: 600; font-size: clamp(22px, 2.6vw, 36px); text-transform: capitalize; }
.a-date small { display: block; font-family: var(--f-mono); font-size: 14px; color: var(--a-muted); text-transform: none; }
.a-tools { margin-left: auto; display: flex; gap: 8px; opacity: .55; transition: opacity .2s; }
.a-tools:hover, .a-tools:focus-within { opacity: 1; }
.a-tools .btn { background: var(--a-panel-2); border-color: var(--a-line); color: var(--a-ink); }
.a-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; align-items: start; }
.a-col { background: var(--a-panel); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.a-pn { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.a-pn h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 2.4vw, 34px); text-transform: uppercase; letter-spacing: .02em; }
.a-pn span { font-family: var(--f-mono); font-size: 15px; color: var(--a-muted); font-variant-numeric: tabular-nums; }
.a-pn span.over { color: var(--a-block); }
.a-of { background: var(--a-panel-2); border-left: 8px solid var(--a-todo); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.a-of.s-en_cours { border-left-color: var(--a-run); background: color-mix(in srgb, var(--a-run) 16%, var(--a-panel-2)); }
.a-of.s-termine { border-left-color: var(--a-done); opacity: .55; }
.a-of.s-bloque { border-left-color: var(--a-block); background: color-mix(in srgb, var(--a-block) 14%, var(--a-panel-2)); }
.a-of .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 17px; }
.a-of .art { font-size: clamp(19px, 1.7vw, 26px); font-weight: 600; line-height: 1.2; }
.a-of .r3 { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 16px; color: var(--a-muted); }
.a-of .note { font-size: 15px; color: var(--a-ink); border-top: 1px solid var(--a-line); padding-top: 4px; }
.a-pill { font-family: var(--f-body); font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--a-line); }
.a-pill.s-en_cours { background: var(--a-run); color: #ffffff; }
.a-pill.s-termine { background: var(--a-done); color: #04140b; }

.a-none { color: var(--a-muted); font-size: 17px; padding: 6px 2px; }
.a-next { border-top: 1px dashed var(--a-line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.a-next h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--a-muted); font-weight: 600; }

.a-foot { margin-top: auto; font-size: 13px; color: var(--a-muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RO_MSG = "Vous pouvez consulter ce planning mais pas le modifier.";
const NB_EMPL = 5, LW = 128;
const DEF = { duree: 17, ouvres: true, noms: ["Emplacement 1", "Emplacement 2", "Emplacement 3", "Emplacement 4", "Emplacement 5"], elecs: [], mecas: [], etapesElec: [], etapesMeca: [], heuresElec: [], heuresMeca: [] };
/* Teintes RAL courantes (approximation écran) */
const RAL = { "1001": "#c2b078", "1015": "#e6d2b5", "3020": "#c1121c", "5010": "#004f7c", "5015": "#2874b2", "6003": "#50533c", "6011": "#6c7c59", "6014": "#47402e", "7016": "#383e42", "7032": "#b8b799", "7035": "#cbd0cc", "7040": "#9da3a6", "8017": "#45322e", "9001": "#e9e0d2", "9005": "#0a0a0a", "9010": "#f1ece1", "9016": "#f1f0ea" };
const RAL_NOMS = { "1001": "beige", "1015": "ivoire clair", "3020": "rouge signalisation", "5010": "bleu gentiane", "5015": "bleu ciel", "6003": "vert olive", "6011": "vert réséda", "6014": "olive jaune", "7016": "gris anthracite", "7032": "gris silex", "7035": "gris clair", "7040": "gris fenêtre", "8017": "brun chocolat", "9001": "blanc crème", "9005": "noir foncé", "9010": "blanc pur", "9016": "blanc signalisation" };
const hexOf = (c) => { const m = String(c || "").match(/\b(\d{4})\b/); return m && RAL[m[1]] ? RAL[m[1]] : ""; };
const sw = (c, big) => c ? `<i class="swatch${big ? " big" : ""}${hexOf(c) ? "" : " unk"}" style="${hexOf(c) ? "background:" + hexOf(c) : ""}" title="Shelter ${esc(c)}"></i>` : "";
const who = (n, e) => (n ? esc(n) : '<b class="miss">à affecter</b>') + (e ? ` <span class="stp">${esc(e)}</span>` : "");

const S = { stations: new Map(), cfg: { ...DEF }, view: "4s", offset: 0, mode: "planning", ready: false };
let db = null, readOnly = false;

/* ---------- Dates et jours travaillés ---------- */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const P = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const add = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const monday = (d) => add(d, -((d.getDay() + 6) % 7));
const isoWeek = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const dd = (d) => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
const ddy = (d) => `${dd(d)}/${String(d.getFullYear()).slice(2)}`;
const diff = (a, b) => Math.round((b - a) / 864e5);
const isWork = (d) => !S.cfg.ouvres || (d.getDay() !== 0 && d.getDay() !== 6);
const snap = (d) => { let r = new Date(d); while (!isWork(r)) r = add(r, 1); return r; };
const nextWork = (d) => snap(add(d, 1));
function endOf(debut, n) { let d = snap(debut), c = 1; while (c < n) { d = add(d, 1); if (isWork(d)) c++; } return d; }
function latestStart(livr, n) { let d = new Date(livr); while (!isWork(d)) d = add(d, -1); let c = 1; while (c < n) { d = add(d, -1); if (isWork(d)) c++; } return d; }

/* ---------- Écritures ---------- */
const queues = {};

function onWriteError(e) {

  else if (e && e.code === "quota_exceeded") toast("Limite de stockage atteinte : supprimez d'anciennes stations livrées.");
  else toast("Enregistrement impossible pour le moment. Réessayez.");
}
function patchS(id, patch) {
  const cur = S.stations.get(id); if (!cur) return;
  S.stations.set(id, { ...cur, ...patch });
  if (db) enqueue("s/" + id, () => db.collection("stations").doc(id).update(patch));
}
function createS(data) {
  const id = db ? db.collection("stations").doc().id : "n" + Date.now();

  if (db) enqueue("s/" + id, () => db.collection("stations").doc(id).set(data));
}
function deleteS(id) { S.stations.delete(id); if (db) enqueue("s/" + id, () => db.collection("stations").doc(id).delete()); }

/* ---------- Placement automatique ---------- */
function earliestIn(row, n, from, skipId) {
  const list = [...S.stations.values()].filter(s => s.id !== skipId && placed(s) && Number(s.emplacement) === row).map(info).sort((a, b) => a.debut - b.debut);
  let cand = snap(from);
  for (const s of list) { if (s.fin < cand) continue; if (endOf(cand, n) < s.debut) break; cand = nextWork(s.fin); }
  return cand;
}
function autoPlace() {
  if (guard()) return;
  const todo = [...S.stations.values()].filter(s => !placed(s)).sort((a, b) => (a.livraison || "9").localeCompare(b.livraison || "9"));
  if (!todo.length) return toast("Le carnet est vide : toutes les commandes sont placées.");
  let late = 0;
  for (const s of todo) {
    let best = null;
    for (let r = 1; r <= NB_EMPL; r++) { const c = earliestIn(r, dur(s), today0(), s.id); if (!best || c < best.c) best = { r, c }; }
    patchS(s.id, { emplacement: best.r, debut: iso(best.c) });
    if (info(S.stations.get(s.id)).retard) late++;
  }
  render();
  toast(`${todo.length} commande${todo.length > 1 ? "s placées" : " placée"}${late ? ` · ${late} sortirai${late > 1 ? "ent" : "t"} après la livraison` : ", toutes à l'heure"}.`);
}

/* ---------- Ordre des étapes par station, charge des personnes, alertes ---------- */
const ROLE_K = { meca: "Meca", elec: "Elec" };
// Ordre des étapes d'une station : son ordre propre s'il existe, sinon la gamme standard
function stationOrder(s, role) {
  const std = (role === "elec" ? S.cfg.etapesElec : S.cfg.etapesMeca) || [], own = s["ordre" + ROLE_K[role]];
  if (!Array.isArray(own) || !own.length) return std;
  const out = own.filter(n => std.includes(n));
  std.forEach(n => { if (!out.includes(n)) out.push(n); });
  return out;
}
const customOrder = (s, role) => Array.isArray(s["ordre" + ROLE_K[role]]) && s["ordre" + ROLE_K[role]].length > 0;
function hoursOf(role, name) {
  const names = (role === "elec" ? S.cfg.etapesElec : S.cfg.etapesMeca) || [], hrs = (role === "elec" ? S.cfg.heuresElec : S.cfg.heuresMeca) || [];
  const i = names.indexOf(name); return i >= 0 && hrs[i] > 0 ? hrs[i] : H_JOUR;
}
// La personne de ce rôle travaille-t-elle sur la station ce jour-là ? Renvoie l'étape (ou "Station") sinon ""
function busyOn(s, role, d) {
  if (!s[role] || !placed(s) || !isWork(d)) return "";
  const i = info(s); if (d < i.debut || d > i.fin) return "";
  const st = stepOf(s, role, iso(d)); if (st) return st;
  return gamme(s, role) ? "" : "Sur la station";
}
const staff = () => {
  const set = new Map();
  (S.cfg.mecas || []).forEach(n => set.set(n, "meca")); (S.cfg.elecs || []).forEach(n => set.has(n) || set.set(n, "elec"));
  for (const s of S.stations.values()) if (placed(s)) { if (s.meca && !set.has(s.meca)) set.set(s.meca, "meca"); if (s.elec && !set.has(s.elec)) set.set(s.elec, "elec"); }
  return set;
};
// Charge : personne → jour (iso) → [{ s, role, step }]
function chargeMap(from, to) {
  const map = new Map(), pl = [...S.stations.values()].filter(placed);
  for (const s of pl) {
    const i = info(s), a = i.debut > from ? i.debut : from, b = i.fin < to ? i.fin : to;
    for (let d = new Date(a); d <= b; d = add(d, 1)) for (const role of ["meca", "elec"]) {
      const st = busyOn(s, role, d); if (!st) continue;
      const p = s[role]; if (!map.has(p)) map.set(p, {});
      ((map.get(p))[iso(d)] = (map.get(p))[iso(d)] || []).push({ s, role, step: st });
    }
  }
  return map;
}
// Regroupe des jours ouvrés consécutifs en plages
function ranges(dates) {
  const out = []; let cur = null;
  dates.sort().forEach(ds => { const d = P(ds); if (cur && +nextWork(cur.to) === +d) cur.to = d; else { cur = { from: d, to: d }; out.push(cur); } });
  return out;
}
const plage = (r) => +r.from === +r.to ? `le ${dd(r.from)}` : `du ${dd(r.from)} au ${dd(r.to)}`;
function alerts(t0) {
  const H = 90, to = add(t0, H), ch = chargeMap(t0, to), A = { over: [], idle: [], late: [], tight: [], nores: [], clash: [] };
  // Surcharge : deux tâches ou plus le même jour
  for (const [p, days] of ch) {
    const byKey = {};
    for (const ds in days) if (days[ds].length > 1) { const k = days[ds].map(x => x.s.id).sort().join("|"); (byKey[k] = byKey[k] || { list: days[ds], dates: [] }).dates.push(ds); }
    for (const k in byKey) ranges(byKey[k].dates).forEach(r => A.over.push({ p, r, list: byKey[k].list }));
  }
  // Sans tâche : jours ouvrés des 4 prochaines semaines sans rien
  const horizon = []; for (let d = snap(t0); horizon.length < 20; d = nextWork(d)) horizon.push(iso(d));
  for (const [p, role] of staff()) {
    if (!(S.cfg.mecas || []).includes(p) && !(S.cfg.elecs || []).includes(p)) continue;
    const days = ch.get(p) || {}, free = horizon.filter(ds => !days[ds]);
    if (free.length) A.idle.push({ p, role, rs: ranges(free), n: free.length });
  }
  const pl = [...S.stations.values()].filter(placed);
  for (const s of pl) {
    const i = info(s); if (i.fin < t0) continue;
    const m = marge(i);
    if (i.retard) A.late.push({ s, i }); else if (m !== null && m <= 2) A.tight.push({ s, i, m });
    if (!s.elec || !s.meca) A.nores.push({ s, i });
  }
  for (let r = 1; r <= NB_EMPL; r++) {
    const l = pl.filter(s => Number(s.emplacement) === r).map(s => ({ s, i: info(s) })).sort((a, b) => a.i.debut - b.i.debut);
    for (let k = 1; k < l.length; k++) if (l[k].i.debut <= l[k - 1].i.fin && l[k].i.fin >= t0) A.clash.push({ a: l[k - 1], b: l[k], r });
  }

}

          cell += `<div class="dc" data-id="${esc(x.s.id)}" data-role="${role}" data-date="${ds}">${multi ? `<span class="tag">${esc(x.s.numero)}</span>` : ""}<span class="jj">J${workCount(x.i.debut, d)}</span>`
            + (x.parts.length ? x.parts.map(q => `<div class="si${q.own ? " own" : ""}${q.own || q.fixed ? " lock" : ""}" ${q.j !== undefined ? `data-j="${q.j}"` : ""} title="${q.own ? "Étape choisie pour ce jour" : q.fixed ? "Étape fixée pour la station" : "Glisser sur une autre étape pour changer l'ordre"}">${q.j !== undefined ? `<i class="gp">⋮⋮</i>` : ""}<span class="nm">${esc(q.n)}</span>${q.h ? `<span class="hh">${fmtHr(q.h)}</span>` : ""}</div>`).join("")
              : `<div class="si none">${gamme(x.s, role) ? "Gamme terminée" : "Étape à définir"}</div>`) + `</div>`;
        }
        if (over.length) clashes++;
        h += `<td class="${+d === +t0 ? "td " : ""}${over.length ? "clash" : ""}">${cell}${over.length ? `<span class="cw">⚠ ${over.join(" · ")}</span>` : ""}</td>`;
      }
      h += `</tr>`;
    }
    h += `</tbody>`;
  }
  h += `</table>`;
  $("gt").style.cssText = ""; $("gt").innerHTML = h;
  $("regle").textContent = `· Cliquez sur un jour pour changer son étape. Glissez une étape sur une autre pour changer l'ordre de montage de la station : la suite se décale.${clashes ? ` ${clashes} case${clashes > 1 ? "s" : ""} en rouge : la personne a une autre tâche le même jour.` : ""}`;
}
// Clic sur un jour : fiche du jour
$("gt").addEventListener("click", (e) => { if (sdragDone) { sdragDone = false; return; } const c = e.target.closest(".wk.fix .dc"); if (c) openDay(c.dataset.id, c.dataset.role, c.dataset.date); });
// Glisser une étape sur une autre : change l'ordre de montage de la station
let sdrag = null, sdragDone = false;
document.addEventListener("pointerdown", (e) => {
  if (S.mode !== "planning" || S.view !== "sem" || e.button !== 0) return;
  const it = e.target.closest(".wk.fix .si[data-j]"); if (!it) return;
  const c = it.closest(".dc"); sdrag = { it, id: c.dataset.id, role: c.dataset.role, j: Number(it.dataset.j), x: e.clientX, y: e.clientY, started: false };
});
function sTarget(g, e) {
  const el = document.elementFromPoint(e.clientX, e.clientY), it = el?.closest(".wk.fix .si[data-j]"), c = (it || el)?.closest(".wk.fix .dc");
  if (!c || c.dataset.id !== g.id || c.dataset.role !== g.role) return null;
  const t = it || c.querySelector(".si[data-j]"); return t ? { el: t, j: Number(t.dataset.j) } : null;
}
document.addEventListener("pointermove", (e) => {
  const g = sdrag; if (!g) return;
  if (!g.started) {
    if (Math.hypot(e.clientX - g.x, e.clientY - g.y) < 6) return;
    if (readOnly) { sdrag = null; toast(RO_MSG); return; }
    g.started = true; g.ghost = g.it.cloneNode(true); g.ghost.classList.add("ghost-si"); g.ghost.style.width = g.it.offsetWidth + "px"; document.body.appendChild(g.ghost); g.it.classList.add("src");
  }
  e.preventDefault();
  g.ghost.style.left = e.clientX + 8 + "px"; g.ghost.style.top = e.clientY + 8 + "px";
  const t = sTarget(g, e); document.querySelectorAll(".si.tg").forEach(x => x.classList.remove("tg"));
  if (t && t.j !== g.j) t.el.classList.add("tg");
});
function sEnd(ok, e) {
  const g = sdrag; sdrag = null; if (!g || !g.started) return;
  sdragDone = true; setTimeout(() => sdragDone = false, 50);
  g.ghost.remove(); document.querySelectorAll(".si.tg, .si.src").forEach(x => x.classList.remove("tg", "src"));
  const s = S.stations.get(g.id), t = ok && s ? sTarget(g, e) : null;
  if (t && t.j !== g.j) {
    const order = [...stationOrder(s, g.role)], [it] = order.splice(g.j, 1); order.splice(t.j, 0, it);
    patchS(g.id, { ["ordre" + ROLE_K[g.role]]: order });
    toast(`${s.numero} : « ${it} » passe en position ${t.j + 1} sur ${order.length}. Les étapes suivantes sont décalées.`);
  }
  render();
}
document.addEventListener("pointerup", (e) => sEnd(true, e));
document.addEventListener("pointercancel", (e) => sEnd(false, e));

function openDay(id, role, ds) {
  const s = S.stations.get(id); if (!s) return;
  const lst = role === "elec" ? S.cfg.etapesElec : S.cfg.etapesMeca, own = (s.jours && s.jours[ds] && s.jours[ds][role]) || "";
  const label = role === "elec" ? "élec" : "méca", d = P(ds);
  openSheet(`<h2>${esc(s.numero)} · ${label}</h2>
    <div class="hint">${esc(s[role] || "Personne non affectée")} · ${esc(d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))} · emplacement ${esc(s.emplacement)}</div>
    <form id="dForm" class="fields">
      <label class="f full">Étape ${label} ce jour-là<input id="d-step" list="dl" value="${esc(own || stepOf(s, role, ds))}"><datalist id="dl">${lst.map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
      <div class="hint full">Sans étape du jour, c'est ${(role === "elec" ? s.etapeElec : s.etapeMeca) ? "l'étape fixée pour la station" : "la gamme"} qui s'affiche : « ${esc(baseStep(s, role, ds) || "aucune")} ».</div>
      <div class="actions full">
        <button class="btn primary" type="submit">Enregistrer pour ce jour</button>
        <button class="btn" type="button" id="dAll">Utiliser pour toute la station</button>
        ${own ? '<button class="btn" type="button" id="dClr">Revenir à l\'étape de la station</button>' : ""}
        ${customOrder(s, role) ? '<button class="btn" type="button" id="dStd">Remettre l\'ordre standard des étapes</button>' : ""}
        <button class="btn" type="button" id="cancel">Annuler</button>
      </div></form>`);
  const setDay = (v) => { const j = { ...(s.jours || {}) }; j[ds] = { ...(j[ds] || {}), [role]: v }; patchS(id, { jours: j }); };
  $("cancel").onclick = closeSheet;
  $("dForm").onsubmit = (e) => { e.preventDefault(); if (guard()) return; setDay($("d-step").value.trim()); closeSheet(); render(); };
  $("dAll").onclick = () => { if (guard()) return; patchS(id, { [role === "elec" ? "etapeElec" : "etapeMeca"]: $("d-step").value.trim() }); closeSheet(); render(); };
  if ($("dClr")) $("dClr").onclick = () => { if (guard()) return; setDay(""); closeSheet(); render(); };
  if ($("dStd")) $("dStd").onclick = () => { if (guard()) return; patchS(id, { ["ordre" + ROLE_K[role]]: "" }); closeSheet(); render(); toast(`${s.numero} : ordre standard des étapes ${label} rétabli.`); };
}

function openSettings() {
  openSheet(`<h2>Réglages</h2>
    <form id="cfgForm" class="fields">
      ${S.cfg.noms.map((n, i) => `<label class="f full">Nom de l'emplacement ${i + 1}<input id="c-n${i}" value="${esc(n)}" required></label>`).join("")}
      <label class="f">Durée standard (jours)<input id="c-duree" type="number" min="1" step="1" value="${esc(S.cfg.duree)}"></label>
      <label class="f">Électriciens (un par ligne)<textarea id="c-elecs" rows="4">${esc(S.cfg.elecs.join("\n"))}</textarea></label>
      <label class="f">Mécaniciens (un par ligne)<textarea id="c-mecas" rows="4">${esc(S.cfg.mecas.join("\n"))}</textarea></label>
      <label class="f">Gamme élec, dans l'ordre (étape ; durée)<textarea id="c-ee" rows="9">${esc(gammeTxt(S.cfg.etapesElec, S.cfg.heuresElec))}</textarea></label>
      <label class="f">Gamme méca, dans l'ordre (étape ; durée)<textarea id="c-em" rows="9">${esc(gammeTxt(S.cfg.etapesMeca, S.cfg.heuresMeca))}</textarea></label>
      <label class="chk" style="align-self:end;padding-bottom:8px"><input id="c-ouvres" type="checkbox"${S.cfg.ouvres ? " checked" : ""}> Jours ouvrés seulement</label>
      <div class="hint full">La durée standard s'applique aux nouvelles commandes et à celles sans durée propre. « Jours ouvrés » exclut les samedis et dimanches du décompte. Gamme : une étape par ligne, avec sa durée en heures ou en jours (ex. « MECA ODO 1 ; 11 h » ou « TEST ELEC ; 4 j », 7 h par jour). Les journées de chaque station se remplissent selon cet ordre, sauf si une étape est fixée sur la station ou sur le jour. Les jours fériés ne sont pas encore pris en compte.</div>
      <div class="actions full"><button class="btn primary" type="submit">Enregistrer</button><button class="btn" type="button" id="cancel">Annuler</button></div>
    </form>`);
  $("cancel").onclick = closeSheet;
  $("cfgForm").onsubmit = (e) => {
    e.preventDefault(); if (guard()) return;
    saveCfg({ noms: S.cfg.noms.map((_, i) => $("c-n" + i).value.trim() || "Emplacement " + (i + 1)), duree: Number($("c-duree").value) || 17, ouvres: $("c-ouvres").checked,
      elecs: lines("c-elecs"), mecas: lines("c-mecas"), ...parseGamme("c-ee", "Elec"), ...parseGamme("c-em", "Meca") });
    closeSheet(); render();
  };
}

/* ---------- Modes ---------- */
let clock = null, wake = null;
async function setMode(m) {
  S.mode = m;
  $("atelier").hidden = m !== "atelier"; $("app").hidden = m === "atelier";
  clearInterval(clock);
  if (m === "atelier") { clock = setInterval(renderAtelier, 15000); try { wake = await navigator.wakeLock?.request("screen"); } catch (_) { wake = null; } }
  else { try { await wake?.release(); } catch (_) {} wake = null; }
  render();
}
window.addEventListener("hashchange", () => setMode(location.hash === "#atelier" ? "atelier" : "planning"));
$("atelierBtn").onclick = () => { location.hash = "atelier"; if (location.hash !== "#atelier") setMode("atelier"); };
$("backBtn").onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); } catch (_) {} history.replaceState(null, "", location.pathname + location.search); setMode("planning"); };
$("fsBtn").onclick = async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch (_) { toast("Le plein écran n'est pas disponible ici. Utilisez la touche F11 du navigateur."); } };
document.addEventListener("visibilitychange", async () => { if (S.mode === "atelier" && document.visibilityState === "visible") { try { wake = await navigator.wakeLock?.request("screen"); } catch (_) {} } });
const setView = (v) => { S.view = v; S.offset = 0; try { localStorage.setItem("vue", v); } catch (_) {} render(); };
$("v4s").onclick = () => setView("4s");
$("v3m").onclick = () => setView("3m");
$("vsem").onclick = () => setView("sem");
$("prev").onclick = () => { S.offset -= S.view === "3m" ? 4 : 1; render(); };
$("next").onclick = () => { S.offset += S.view === "3m" ? 4 : 1; render(); };
$("todayBtn").onclick = () => { S.offset = 0; render(); };
$("newS").onclick = () => guard() || openEdit(null);
$("setBtn").onclick = openSettings;
$("autoBtn").onclick = autoPlace;
let rz = null; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
try { const v = localStorage.getItem("vue"); S.view = ["3m", "4s", "sem"].includes(v) ? v : "sem"; } catch (_) { S.view = "sem"; }

let toastT = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }

/* ---------- Démarrage ---------- */
setMode(location.hash === "#atelier" ? "atelier" : "planning");
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (_) { db = null; }
  if (!db) {
    S.stations = demoData(); S.ready = true; S.cfg = { ...DEF, elecs: ["Élec A", "Élec B", "Élec C"], mecas: ["Méca A", "Méca B", "Méca C"], etapesElec: DEMO_EE, etapesMeca: DEMO_EM, heuresElec: DEMO_HE, heuresMeca: DEMO_HM };
    $("banner").textContent = "Mode démonstration avec des commandes d'exemple : les modifications ne sont pas enregistrées dans cette vue.";
    $("banner").hidden = false; render(); return;
  }
  let gs = false, gc = false;
  const fail = (e) => { if (e?.code !== "revoked") toast("Connexion au planning interrompue. Rechargez la page."); $("alive").textContent = "Mise à jour interrompue"; };
  db.collection("stations").onSnapshot((snap) => {
    S.stations = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    gs = gs || !snap.metadata.fromCache || snap.size > 0; S.ready = gs && gc; render();
  }, fail);
  db.doc("reglages/general").onSnapshot((d) => {
    if (d.exists) { const c = d.data(); S.cfg = { ...DEF, ...c, elecs: c.elecs || [], mecas: c.mecas || [], etapesElec: c.etapesElec || [], etapesMeca: c.etapesMeca || [], heuresElec: c.heuresElec || [], heuresMeca: c.heuresMeca || [], noms: Array.from({ length: NB_EMPL }, (_, i) => (c.noms || [])[i] || DEF.noms[i]) }; }
    gc = true; S.ready = gs && gc; render();
  }, fail);
})();
})();
</script>
